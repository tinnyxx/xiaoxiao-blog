server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name xiaoxiaoptopfile.top www.xiaoxiaoptopfile.top;

    # HTTPS 证书（certbot 默认路径；用别的 ACME 客户端请改成对应路径）
    ssl_certificate /etc/letsencrypt/live/xiaoxiaoptopfile.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiaoxiaoptopfile.top/privkey.pem;

    # 静态资源目录：Astro standalone 构建产物的 client/ 部分
    root /var/www/xiaoxiaoptopfile.top/client;
    index index.html;

    # B 站工具用到的公开接口代理（保持原有行为，避免跨域）
    location = /api/bili-userinfo {
        proxy_pass https://uapis.cn/api/v1/social/bilibili/userinfo;
        proxy_ssl_server_name on;
        proxy_set_header Host uapis.cn;
    }

    # 带内容哈希的构建产物：文件名变了才算变，长期缓存
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # favicon、public/ 里的固定资源：缓存但保留校验
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 其余请求交给 Node 服务（SSR 页面 + /api/*）
    location / {
        try_files $uri $uri/ @node;
    }

    location @node {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式输出必需：关掉缓冲，否则打字机效果会被攒成一大块
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

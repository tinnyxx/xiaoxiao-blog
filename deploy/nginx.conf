server {
    listen 80;
    listen [::]:80;
    server_name xiaoxiaoptopfile.top www.xiaoxiaoptopfile.top;

    root /var/www/xiaoxiaoptopfile.top;
    index index.html;

    # Astro 默认按目录输出：/blog/xxx/index.html
    # HTML 每次都要回源校验，否则改版后浏览器会继续用缓存里的旧页面。
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # 代理 UAPI，避免浏览器跨域拦截 UP 主公开资料
    location = /api/bili-userinfo {
        proxy_pass https://uapis.cn/api/v1/social/bilibili/userinfo;
        proxy_ssl_server_name on;
        proxy_set_header Host uapis.cn;
    }

    # Astro 的构建产物带内容哈希，文件名变了才算变，可以长期缓存。
    # ^~ 让这个前缀匹配优先于下面的正则匹配。
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # favicon、public/ 里的固定文件名资源：缓存但保留校验。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
